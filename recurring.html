<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مالي — العمليات المتكررة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="aurora"><span></span><span></span><span></span></div>

    <div id="authGate" class="d-flex flex-column gap-3">
        <div class="spinner-border" role="status"></div>
    </div>

    <div id="appScreen" class="container py-4 hidden">
        <header class="app-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-0">العمليات المتكررة</h3>
                    <small id="userEmail" class="opacity-75"></small>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <div id="themeToggle" title="تبديل الوضع">
                        <i class="bi bi-moon-stars-fill fs-5"></i>
                    </div>
                    <button id="logoutBtn" class="btn btn-light btn-sm fw-bold px-3">خروج</button>
                </div>
            </div>
            <nav class="app-nav">
                <a href="dashboard.html"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
                <a href="transactions.html"><i class="bi bi-list-ul"></i> سجل العمليات</a>
                <a href="budget.html"><i class="bi bi-pie-chart"></i> الميزانية</a>
                <a href="recurring.html" class="active"><i class="bi bi-arrow-repeat"></i> المتكررة</a>
            </nav>
        </header>

        <!-- التقسيمة بعرض الصفحة بالكامل (صف يحتوي على عمودين متساوين) -->
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-3 p-md-4 h-100">
                    <h6 class="fw-bold mb-3 border-bottom pb-2">العمليات المتكررة الحالية</h6>
                    <div id="recurringList" class="w-100" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card p-3 p-md-4 h-100">
                    <h6 class="fw-bold mb-3 border-bottom pb-2">إضافة عملية متكررة</h6>
                    <form id="recurringForm">
                        <div class="mb-3">
                            <input type="number" id="recAmount" class="form-control" placeholder="المبلغ (ج.م)" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <select id="recType" class="form-select">
                                    <option value="expense">مصروف</option>
                                    <option value="income">دخل</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <select id="recCategory" class="form-select"></select>
                            </div>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-7">
                                <input type="text" id="recDescription" class="form-control" placeholder="الوصف (اختياري)">
                            </div>
                            <div class="col-5">
                                <input type="number" id="recDay" class="form-control" placeholder="يوم الشهر" min="1" max="28" value="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-arrow-repeat me-1"></i>إضافة عملية متكررة
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/categories.js"></script>
    <script>
        let allData = [];
        let budgets = {};
        let recurringItems = [];

        requireAuth(() => {
            initLogout();
            initThemeToggle();
            loadCategories(() => {
                populateCategorySelect(document.getElementById('recCategory'), document.getElementById('recType').value);
            });
            document.getElementById('recType').onchange = e => populateCategorySelect(document.getElementById('recCategory'), e.target.value);

            loadData();
            loadBudgets();
            loadRecurring();
            bindForm();
        });

        function loadData() {
            db.ref(`users/${currentUser.uid}/transactions`).on('value', snap => {
                allData = [];
                snap.forEach(s => { allData.push({ id: s.key, ...s.val() }); });
                processRecurring();
            });
        }

        function loadBudgets() {
            db.ref(`users/${currentUser.uid}/budgets`).on('value', snap => { budgets = snap.val() || {}; });
        }

        function getBudgetForCategory(catName) {
            const b = budgets[catKey(catName)];
            return b ? Number(b.amount) || 0 : 0;
        }

        function loadRecurring() {
            db.ref(`users/${currentUser.uid}/recurring`).on('value', snap => {
                recurringItems = [];
                snap.forEach(s => recurringItems.push({ id: s.key, ...s.val() }));
                renderRecurringList();
                processRecurring();
            });
        }

        function renderRecurringList() {
            const container = document.getElementById('recurringList');
            if (!container) return;
            if (!recurringItems.length) {
                container.innerHTML = `<p class="text-muted small text-center mb-0">لا توجد عمليات متكررة بعد</p>`;
                return;
            }
            container.innerHTML = recurringItems.map(r => `
                <div class="recurring-item d-flex justify-content-between align-items-center p-2 mb-2 border-bottom">
                    <div>
                        <b class="d-block small">${r.category} <span class="text-muted fw-normal">(${r.type === 'income' ? 'دخل' : 'مصروف'})</span></b>
                        <span class="desc-text text-muted" style="font-size: 0.8rem;">${r.description ? r.description + ' — ' : ''}يوم ${r.day} من كل شهر</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <b class="${r.type === 'income' ? 'text-success' : 'text-danger'} small">${Number(r.amount).toLocaleString()} ج.م</b>
                        <i class="bi bi-trash text-muted" style="cursor:pointer" onclick="deleteRecurring('${r.id}')" title="حذف"></i>
                    </div>
                </div>
            `).join('');
        }

        function deleteRecurring(id) {
            if (confirm('حذف هذه العملية المتكررة؟')) {
                db.ref(`users/${currentUser.uid}/recurring/${id}`).remove().then(() => {
                    showToast('تم حذف العملية المتكررة بنجاح', 'success');
                });
            }
        }

        function bindForm() {
            document.getElementById('recurringForm').onsubmit = e => {
                e.preventDefault();
                const item = {
                    amount: parseFloat(document.getElementById('recAmount').value),
                    type: document.getElementById('recType').value,
                    category: document.getElementById('recCategory').value,
                    description: document.getElementById('recDescription').value,
                    day: parseInt(document.getElementById('recDay').value) || 1,
                    lastGeneratedMonth: ""
                };
                db.ref(`users/${currentUser.uid}/recurring`).push(item).then(() => {
                    e.target.reset();
                    document.getElementById('recType').dispatchEvent(new Event('change'));
                    document.getElementById('recDay').value = 1;
                    showToast('تمت إضافة العملية المتكررة بنجاح', 'success');
                });
            };
        }

        function processRecurring() {
            if (!currentUser || !recurringItems.length) return;
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDate = now.getDate();
            const monthKey = `${currentYear}-${currentMonth}`;

            recurringItems.forEach(r => {
                // التحقق لكل عملية متكررة على حدة عما إذا كان اليوم قد وصل ولم يتم توليدها لهذا الشهر
                if (r.lastGeneratedMonth !== monthKey && currentDate >= (r.day || 1)) {
                    const newTx = {
                        amount: r.amount,
                        type: r.type,
                        category: r.category,
                        description: r.description ? `${r.description} (متكرر)` : 'عملية متكررة',
                        date: now.toISOString().split('T')[0]
                    };
                    db.ref(`users/${currentUser.uid}/transactions`).push(newTx).then(() => {
                        db.ref(`users/${currentUser.uid}/recurring/${r.id}`).update({ lastGeneratedMonth: monthKey });
                        showToast(`تم تسجيل عملية متكررة: ${r.category}`, 'success');
                        if (newTx.type === 'expense') checkBudgetAlert(newTx);
                    });
                }
            });
        }

        function checkBudgetAlert(item) {
            const now = new Date();
            const itemDate = new Date(item.date);
            if (itemDate.getFullYear() !== now.getFullYear() || itemDate.getMonth() !== now.getMonth()) return;
            const budget = getBudgetForCategory(item.category);
            if (!budget) return;
            const spentBefore = allData.filter(t => t.type === 'expense' && t.category === item.category &&
                new Date(t.date).getFullYear() === now.getFullYear() && new Date(t.date).getMonth() === now.getMonth()
            ).reduce((s, t) => s + t.amount, 0);
            const spentAfter = spentBefore + item.amount;
            const pct = (spentAfter / budget) * 100;
            if (pct >= 100) showToast(`تجاوزت ميزانية "${item.category}" الشهرية!`, 'danger');
            else if (pct >= 90) showToast(`اقتربت من حد ميزانية "${item.category}" (${Math.round(pct)}%)`, 'warn');
        }
    </script>
</body>
</html>
