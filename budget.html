<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مالي — الميزانية الشهرية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="aurora"><span></span><span></span><span></span></div>

    <div id="authGate" class="d-flex flex-column gap-3">
        <div class="spinner-border" role="status"></div>
    </div>

    <div id="appScreen" class="container py-4 hidden">
        <header class="app-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-0">الميزانية الشهرية</h3>
                    <small id="userEmail" class="opacity-75"></small>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <div id="themeToggle" title="تبديل الوضع">
                        <i class="bi bi-moon-stars-fill fs-5"></i>
                    </div>
                    <button id="logoutBtn" class="btn btn-light btn-sm fw-bold px-3">خروج</button>
                </div>
            </div>
            <nav class="app-nav">
                <a href="dashboard.html"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
                <a href="transactions.html"><i class="bi bi-list-ul"></i> سجل العمليات</a>
                <a href="budget.html" class="active"><i class="bi bi-pie-chart"></i> الميزانية</a>
                <a href="recurring.html"><i class="bi bi-arrow-repeat"></i> المتكررة</a>
            </nav>
        </header>

        <div class="row g-4">
            <div class="col-12">
                <div class="card p-3 p-md-4 w-100" id="budgetCard">
                    <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 flex-wrap gap-2">
                        <h6 class="fw-bold mb-0">حدود الصرف الشهرية</h6>
                        <small class="text-muted selectedMonthText"></small>
                    </div>
                    <p class="text-muted small mb-3">حدد سقف شهري لكل تصنيف مصروفات وهيتلون الشريط لما تقرب من الحد. هتوصلك تنبيهات لو قربت أو تخطيت الحد.</p>
                    <div id="budgetList" class="w-100"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/categories.js"></script>
    <script>
        let allData = [];
        let budgets = {};

        requireAuth(() => {
            initLogout();
            initThemeToggle();
            loadCategories(() => renderBudgetList());
            loadData();
            loadBudgets();
        });

        function loadData() {
            db.ref(`users/${currentUser.uid}/transactions`).on('value', snap => {
                allData = [];
                snap.forEach(s => { allData.push({ id: s.key, ...s.val() }); });
                renderBudgetList();
            });
        }

        function loadBudgets() {
            db.ref(`users/${currentUser.uid}/budgets`).on('value', snap => {
                budgets = snap.val() || {};
                renderBudgetList();
            });
        }

        function getBudgetForCategory(catName) {
            const b = budgets[catKey(catName)];
            return b ? Number(b.amount) || 0 : 0;
        }

        function setBudgetForCategory(catName, amount) {
            db.ref(`users/${currentUser.uid}/budgets/${catKey(catName)}`).set({ name: catName, amount: amount });
        }

        function renderBudgetList() {
            const container = document.getElementById('budgetList');
            if (!container || !currentUser) return;
            const now = new Date();
            const monthLabel = document.querySelector('.selectedMonthText');
            if (monthLabel) monthLabel.textContent = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;

            const expCats = getCategories('expense');
            container.innerHTML = expCats.map(cat => {
                const spent = allData.filter(t => t.type === 'expense' && t.category === cat &&
                    new Date(t.date).getFullYear() === now.getFullYear() && new Date(t.date).getMonth() === now.getMonth()
                ).reduce((s, t) => s + t.amount, 0);
                const budget = getBudgetForCategory(cat);
                const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
                let barColor = 'var(--success)';
                if (budget > 0) {
                    if (pct >= 100) barColor = 'var(--danger)';
                    else if (pct >= 75) barColor = 'var(--amber)';
                }
                const warn = budget > 0 && pct >= 90 ? `<i class="bi bi-exclamation-triangle-fill ms-1" style="color: var(--amber); font-size:0.75rem;"></i>` : '';
                return `
                <div class="budget-row mb-3">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-1">
                        <span class="fw-bold small">${cat}${warn}</span>
                        <span class="small text-muted d-flex align-items-center gap-1">
                            ${spent.toLocaleString()} /
                            <input type="number" class="form-control form-control-sm budget-input" style="width: 110px;" data-cat="${cat}" value="${budget || ''}" placeholder="بدون حد">
                        </span>
                    </div>
                    ${budget > 0 ? `<div class="progress-track w-100"><div class="progress-fill" style="width:${pct}%; background:${barColor};"></div></div>` : ''}
                </div>`;
            }).join('');

            container.querySelectorAll('.budget-input').forEach(inp => {
                inp.addEventListener('change', e => {
                    const cat = e.target.dataset.cat;
                    const val = parseFloat(e.target.value) || 0;
                    setBudgetForCategory(cat, val);
                    showToast(`تم تحديث حد "${cat}"`, 'success');
                });
            });
        }
    </script>
</body>
</html>
