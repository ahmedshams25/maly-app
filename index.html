<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مالي — تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="aurora"><span></span><span></span><span></span></div>

    <div id="authScreen" class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg text-center" style="max-width: 420px; width: 100%;">
            <div class="mb-4">
                <div class="wallet-emblem"><i class="bi bi-wallet2 fs-3"></i></div>
                <h2 class="fw-bold mt-3">مالي</h2>
                <p class="text-muted small">أدر مصروفاتك بذكاء واحترافية</p>
            </div>
            <div class="text-start">
                <label class="small fw-bold mb-1">البريد الإلكتروني</label>
                <input type="email" id="authEmail" class="form-control mb-3" placeholder="name@example.com">
                <label class="small fw-bold mb-1">كلمة المرور</label>
                <input type="password" id="authPassword" class="form-control mb-4" placeholder="••••••••">
            </div>
            <button id="loginBtn" class="btn btn-primary w-100 mb-2 py-2">تسجيل دخول</button>
            <button id="signupBtn" class="btn btn-outline-secondary w-100 py-2">إنشاء حساب جديد</button>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="assets/js/core.js"></script>
    <script>
        // لو المستخدم مسجل دخول فعلاً، يتوجه للداشبورد على طول
        redirectIfAuthed();

        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => window.location.href = 'dashboard.html')
                .catch(err => showToast('خطأ: ' + err.message, 'danger'));
        };

        document.getElementById('signupBtn').onclick = () => {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => window.location.href = 'dashboard.html')
                .catch(err => showToast('خطأ: ' + err.message, 'danger'));
        };
    </script>
</body>
</html>
