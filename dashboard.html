<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مالي — لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .blurred-balance {
            filter: blur(8px);
            user-select: none;
            cursor: pointer;
            transition: filter 0.3s ease;
        }
        .blurred-balance.revealed {
            filter: blur(0);
        }
    </style>
</head>
<body>

    <div class="aurora"><span></span><span></span><span></span></div>

    <div id="authGate" class="d-flex flex-column gap-3">
        <div class="spinner-border" role="status"></div>
    </div>

    <div id="appScreen" class="container py-4 hidden">
        <header class="app-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-0">لوحة التحكم</h3>
                    <small id="userEmail" class="opacity-75"></small>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <div id="themeToggle" title="تبديل الوضع">
                        <i class="bi bi-moon-stars-fill fs-5"></i>
                    </div>
                    <button id="logoutBtn" class="btn btn-light btn-sm fw-bold px-3">خروج</button>
                </div>
            </div>
            <nav class="app-nav">
                <a href="dashboard.html" class="active"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
                <a href="transactions.html"><i class="bi bi-list-ul"></i> سجل العمليات</a>
                <a href="budget.html"><i class="bi bi-pie-chart"></i> الميزانية</a>
                <a href="recurring.html"><i class="bi bi-arrow-repeat"></i> المتكررة</a>
            </nav>
        </header>

        <!-- الصف العلوي: عرض بيانات السنة بجوار إضافة عملية جديدة (ياخذان كامل الصفحة) -->
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-4 text-center h-100 d-flex flex-column justify-content-center">
                    <label class="small text-muted mb-2">عرض بيانات سنة:</label>
                    <select id="yearSelect" class="form-select form-select-sm mb-4 mx-auto" style="max-width: 150px;"></select>

                    <p class="text-muted mb-1 small">الرصيد المتاح (<span class="selectedYearText"></span>) <i class="bi bi-shield-lock text-primary ms-1" style="cursor:pointer;" title="محمي برمز سري" onclick="toggleBalanceVisibility()"></i></p>
                    <h2 id="currentBalance" class="fw-bold mb-4 text-primary blurred-balance" title="انقر للإظهار" onclick="toggleBalanceVisibility()">0 ج.م</h2>

                    <div class="row g-0 border-top pt-3">
                        <div class="col-6 border-start">
                            <small class="text-success d-block fw-bold">إجمالي الدخل</small>
                            <span id="totalIncome" class="fs-5 fw-bold blurred-balance" title="انقر للإظهار" onclick="toggleBalanceVisibility()">0</span>
                        </div>
                        <div class="col-6">
                            <small class="text-danger d-block fw-bold">إجمالي الصرف</small>
                            <span id="totalExpense" class="fs-5 fw-bold blurred-balance" title="انقر للإظهار" onclick="toggleBalanceVisibility()">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6">
                <div class="card p-4 h-100 d-flex flex-column justify-content-center">
                    <h6 class="fw-bold mb-3 border-bottom pb-2">إضافة عملية جديدة</h6>
                    <form id="dashboardTransactionForm">
                        <div class="mb-3">
                            <input type="number" id="dashAmount" class="form-control" placeholder="المبلغ (ج.م)" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <select id="dashType" class="form-select">
                                    <option value="expense">مصروف</option>
                                    <option value="income">دخل</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <div class="d-flex gap-1">
                                    <select id="dashCategory" class="form-select"></select>
                                    <div class="icon-btn-add" id="dashAddCategoryBtn" title="إضافة تصنيف جديد"><i class="bi bi-plus-lg"></i></div>
                                </div>
                            </div>
                        </div>
                        <input type="text" id="dashDescription" class="form-control mb-3" placeholder="وصف العملية...">
                        <input type="date" id="dashDate" class="form-control mb-4" required>
                        <button type="submit" class="btn btn-primary w-100">حفظ العملية</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- الصف السفلي: التحليل الشهري وتوزيع المصاريف (ياخذان كامل الصفحة) -->
        <div class="row g-4 mt-2">
            <div class="col-lg-6">
                <div class="card p-3 h-100">
                    <h6 class="fw-bold mb-3">التحليل الشهري</h6>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card p-3 h-100">
                    <h6 class="fw-bold mb-3">توزيع المصاريف</h6>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- إضافة تصنيف Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="fw-bold">إضافة تصنيف جديد</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryFormType">
                        <label class="small fw-bold mb-1">اسم التصنيف</label>
                        <input type="text" id="newCategoryName" class="form-control mb-4" placeholder="مثال: اشتراكات" required>
                        <button type="submit" class="btn btn-primary w-100 py-2">إضافة</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/categories.js"></script>
    <script>
        let allData = [], barChart, pieChart;
        let isBalanceRevealed = false;

        requireAuth(() => {
            initLogout();
            initThemeToggle(() => refreshUI());
            initCategoryModal();
            loadCategories(() => {
                populateCategorySelect(document.getElementById('dashCategory'), document.getElementById('dashType').value);
            });
            document.getElementById('dashAddCategoryBtn').onclick = () => openCategoryModal(document.getElementById('dashType').value);
            document.getElementById('dashType').onchange = e => populateCategorySelect(document.getElementById('dashCategory'), e.target.value);
            document.getElementById('dashDate').value = new Date().toISOString().split('T')[0];

            document.getElementById('dashboardTransactionForm').onsubmit = e => {
                e.preventDefault();
                const item = {
                    amount: parseFloat(document.getElementById('dashAmount').value),
                    type: document.getElementById('dashType').value,
                    category: document.getElementById('dashCategory').value,
                    description: document.getElementById('dashDescription').value,
                    date: document.getElementById('dashDate').value
                };
                db.ref(`users/${currentUser.uid}/transactions`).push(item).then(() => {
                    e.target.reset();
                    document.getElementById('dashType').dispatchEvent(new Event('change'));
                    document.getElementById('dashDate').value = new Date().toISOString().split('T')[0];
                    showToast('تمت إضافة العملية بنجاح', 'success');
                });
            };

            loadData();
        });

        function toggleBalanceVisibility() {
            const elements = document.querySelectorAll('.blurred-balance');
            if (isBalanceRevealed) {
                isBalanceRevealed = false;
                elements.forEach(el => el.classList.remove('revealed'));
                return;
            }
            const pin = prompt('أدخل الرمز السري أو بصمة الوجه (5710):');
            if (pin === '5710') {
                isBalanceRevealed = true;
                elements.forEach(el => el.classList.add('revealed'));
                showToast('تم التحقق بنجاح', 'success');
            } else if (pin !== null) {
                showToast('الرمز السري غير صحيح', 'danger');
            }
        }

        function loadData() {
            db.ref(`users/${currentUser.uid}/transactions`).on('value', snap => {
                allData = [];
                snap.forEach(s => { allData.push({ id: s.key, ...s.val() }); });
                allData.sort((a, b) => new Date(b.date) - new Date(a.date));
                updateYearDropdown();
                refreshUI();
            });
        }

        function updateYearDropdown() {
            const select = document.getElementById('yearSelect');
            const years = [...new Set(allData.map(t => new Date(t.date).getFullYear()))].sort((a,b)=>b-a);
            const currentVal = select.value;
            let options = `<option value="all">كل السنين</option>`;
            options += years.map(y => `<option value="${y}">${y}</option>`).join('');
            select.innerHTML = options;
            select.value = currentVal || new Date().getFullYear();
        }
        document.getElementById('yearSelect').onchange = refreshUI;

        function getYearScopedData() {
            const yearVal = document.getElementById('yearSelect').value;
            const isAllTime = yearVal === 'all';
            return isAllTime ? allData : allData.filter(t => new Date(t.date).getFullYear() === parseInt(yearVal));
        }

        function refreshUI() {
            const yearVal = document.getElementById('yearSelect').value;
            const isAllTime = yearVal === 'all';
            document.querySelectorAll('.selectedYearText').forEach(el => el.textContent = isAllTime ? "كل السنين" : yearVal);

            const yearScoped = getYearScopedData();
            const inc = yearScoped.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const exp = yearScoped.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

            document.getElementById('currentBalance').textContent = (inc - exp).toLocaleString() + " ج.م";
            document.getElementById('totalIncome').textContent = inc.toLocaleString();
            document.getElementById('totalExpense').textContent = exp.toLocaleString();

            renderBarChart(yearScoped);
            renderPieChart(yearScoped);
        }

        function renderBarChart(dataToChart) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChart) barChart.destroy();

            const monthly = Array(12).fill(0).map(() => ({ i: 0, e: 0 }));
            dataToChart.forEach(t => {
                const m = new Date(t.date).getMonth();
                t.type === 'income' ? monthly[m].i += t.amount : monthly[m].e += t.amount;
            });

            const isDark = document.body.classList.contains('dark-mode');
            const cs = getComputedStyle(document.body);
            const labelColor = cs.getPropertyValue('--text-muted').trim();
            const successColor = cs.getPropertyValue('--success').trim();
            const dangerColor = cs.getPropertyValue('--danger').trim();
            const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(30,27,75,0.06)';

            barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthNames.map((n, i) => i + 1),
                    datasets: [
                        { label: 'دخل', data: monthly.map(m => m.i), backgroundColor: successColor, borderRadius: 8 },
                        { label: 'صرف', data: monthly.map(m => m.e), backgroundColor: dangerColor, borderRadius: 8 }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: labelColor, font: { family: 'Cairo' } } } },
                    scales: {
                        x: { ticks: { color: labelColor }, grid: { display: false } },
                        y: { ticks: { color: labelColor }, grid: { color: gridColor } }
                    },
                    onClick: (e, el) => {
                        if (el.length > 0) {
                            const mIdx = el[0].index;
                            const type = el[0].datasetIndex === 0 ? 'income' : 'expense';
                            const yearVal = document.getElementById('yearSelect').value;
                            window.location.href = `transactions.html?month=${mIdx}&type=${type}&year=${yearVal}`;
                        }
                    }
                }
            });
        }

        function renderPieChart(dataToChart) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (pieChart) pieChart.destroy();
            const expData = dataToChart.filter(t => t.type === 'expense');
            const catTotals = {};
            expData.forEach(t => catTotals[t.category] = (catTotals[t.category] || 0) + t.amount);

            const isDark = document.body.classList.contains('dark-mode');
            const csP = getComputedStyle(document.body);

            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catTotals),
                    datasets: [{
                        data: Object.values(catTotals),
                        backgroundColor: ['#0A84FF', '#FF3B30', '#30D158', '#FF9F0A', '#5E5CE6', '#64D2FF', '#FF375F'],
                        borderWidth: 2,
                        borderColor: isDark ? 'rgba(28,28,30,0.6)' : 'rgba(255,255,255,0.9)',
                        hoverOffset: 6
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: csP.getPropertyValue('--text-main').trim(), boxWidth: 12, font: { size: 11, family: 'Cairo' } }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
